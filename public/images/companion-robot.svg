<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Avaada Companion robot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3E6F7"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FB8"/>
      <stop offset="0.55" stop-color="#2FA0D8"/>
      <stop offset="1" stop-color="#6DB33F"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4F86"/>
      <stop offset="1" stop-color="#0E2F52"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEF8"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9F27C"/>
      <stop offset="1" stop-color="#4FB848"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- brand swoosh behind the robot -->
    <path d="M-10 150 C 40 110, 80 175, 120 135 S 190 90, 215 110" fill="none" stroke="url(#swoosh)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <path d="M-10 168 C 45 130, 90 190, 130 152 S 190 120, 215 135" fill="none" stroke="#6DB33F" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <!-- shoulders -->
    <path d="M44 205 C 44 168, 70 152, 100 152 C 130 152, 156 168, 156 205 Z" fill="url(#shell)" stroke="#BCD2E8" stroke-width="2"/>
    <path d="M86 156 L100 172 L114 156" fill="none" stroke="#1F6FB8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- antenna -->
    <line x1="100" y1="40" x2="100" y2="56" stroke="#1B4F86" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="35" r="7" fill="url(#eye)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- ears -->
    <rect x="30" y="86" width="14" height="30" rx="7" fill="#1F6FB8"/>
    <rect x="156" y="86" width="14" height="30" rx="7" fill="#1F6FB8"/>

    <!-- head -->
    <rect x="42" y="56" width="116" height="92" rx="34" fill="url(#shell)" stroke="#BCD2E8" stroke-width="2.5"/>

    <!-- visor -->
    <rect x="56" y="74" width="88" height="52" rx="24" fill="url(#visor)"/>
    <path d="M66 84 C 80 78, 120 78, 134 84" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.22"/>

    <!-- eyes -->
    <circle cx="82" cy="100" r="9" fill="url(#eye)"/>
    <circle cx="118" cy="100" r="9" fill="url(#eye)"/>
    <circle cx="85" cy="97" r="2.6" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="121" cy="97" r="2.6" fill="#FFFFFF" opacity="0.85"/>

    <!-- smile -->
    <path d="M91 116 Q 100 122 109 116" fill="none" stroke="#9BE06A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <circle cx="100" cy="100" r="98.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
</svg>
